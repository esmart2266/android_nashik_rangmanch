apply plugin: 'com.android.application'
apply plugin: 'com.google.gms.google-services'
// Apply the Crashlytics Gradle plugin
apply plugin: 'com.google.firebase.crashlytics'

android {
    signingConfigs {
        release {
            storeFile file("D:\\Android-eSmart\\Nashik Smart Reservation System\\NSRS\\keystore.jks")
            storePassword = 'eSmart2266$'
            keyAlias = 'key0'
            keyPassword 'eSmart2266$'
        }
    }
    namespace 'in.gov.nmc.rangmach'
    compileSdkVersion 36
    defaultConfig {
        applicationId "in.gov.nmc.rangmach"
        minSdkVersion 24
        targetSdkVersion 36
        versionCode 19
        versionName "19"
        vectorDrawables.useSupportLibrary = true
        multiDexEnabled true
        renderscriptSupportModeEnabled true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

//        buildConfigField 'String', 'BASE_URL', '"https://smartleaders.in/"'
//        buildConfigField 'String', 'API_FOLDER', '"/cultural-dev/pune/"'
//        buildConfigField 'String', 'API_PATH', '"/cultural-dev/pune/MobileApi/"'
//        buildConfigField 'String', 'PhotoPath', '"cultural-dev/pune/MobileApi/"'
//        buildConfigField 'String', 'NMCNSRS', '"cultural-dev/pune/"'

        buildConfigField 'String', 'BASE_URL', '"https://cultural.nmc.gov.in/"'
        buildConfigField 'String', 'API_PATH', '"/MobileApi/"'
        buildConfigField 'String', 'PhotoPath', '"MobileApi/"'
        buildConfigField 'String', 'PaymentApi', '"PaymentApi/"'

        // ✅ Add this block here
//        ndk {
//            abiFilters "armeabi-v7a", "arm64-v8a"
//        }
    }

    ndkVersion "26.2.11394342"//"22.1.7171670" old
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'

        }
        debug {
            minifyEnabled false
            shrinkResources false
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }

    packagingOptions {
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/NOTICE.txt'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildFeatures {

        viewBinding = true
        buildConfig true

    }
    lintOptions {
        checkReleaseBuilds false
        // Or, if you prefer, you can continue to check for errors in release builds,
        // but continue the build even when errors are found:
        abortOnError false
    }

    splits {
        abi {
            enable project.hasProperty('buildApkSplits')
            reset()
            include 'armeabi-v7a', 'arm64-v8a'
            universalApk false
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.cardview:cardview:1.0.0'
